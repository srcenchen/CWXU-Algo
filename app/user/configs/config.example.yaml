server:
  http:
    addr: 0.0.0.0:8000
    # 站点设置保存会实测洛谷/QOJ 登录（含验证码），过短会超时
    timeout: 90s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 90s
  reg_dsn: 192.168.1.7:8500
  # 三个业务服务与网关必须使用同一个 JWT 密钥（至少 32 字符）
  jwt_secret: ""
  # RSA 私钥 PEM（签发；仅 user/agent 配置），生成方式：openssl genrsa -out /tmp/jwt_rsa.pem 2048
  # 与 jwt_public_key 必须配对；环境变量 CWXU_JWT_PRIVATE_KEY 可覆盖
  jwt_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    <RSA 私钥 PEM，openssl genrsa 2048 生成>
    -----END RSA PRIVATE KEY-----
  # RSA 公钥 PEM（验证；所有服务配置），生成方式：openssl rsa -in /tmp/jwt_rsa.pem -pubout
  # user/core_data/agent 三服务与网关配置必须与 user 服务私钥配对；环境变量 CWXU_JWT_PUBLIC_KEY 可覆盖
  jwt_public_key: |
    -----BEGIN PUBLIC KEY-----
    <RSA 公钥 PEM>
    -----END PUBLIC KEY-----
data:
  database:
    driver: postgres
    source: host=192.168.1.7 user=cwxu password=cwxu dbname=algo_user port=5432 sslmode=disable TimeZone=Asia/Shanghai
  # 站点备份：默认会把 dbname=algo_user 推导为 algo_core_data；
  # 也可显式覆盖：环境变量 CWXU_CORE_DATABASE_SOURCE=host=... dbname=algo_core_data ...
  redis:
    addr: 192.168.1.7:6379
    password: cwxu
    read_timeout: 2s
    write_timeout: 2s
# 客户中心（工单系统）对接；值为空时工单接口返回「支持中心未配置」，不 panic
support_center:
  base_url: ""          # 形如 https://support.example.com
  product_id: ""        # 客户中心创建产品时返回的 UUID
  sign_key: ""          # 客户中心创建产品时仅回显一次的 callback_secret（回调 HMAC-SHA256 验签密钥）
  timeout: 5s
