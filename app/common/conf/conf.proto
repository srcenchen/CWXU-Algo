syntax = "proto3";
package kratos.api;

option go_package = "cwxu-algo/app/user/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  // Deprecated: 仅供旧 YAML 启动时一次性迁移到 site_configs；运行时不读取。
  SMTP smtp = 3 [deprecated = true];
  Agent agent = 4 [deprecated = true];
  AiAnalyze ai_analyze = 5 [deprecated = true];
  SupportCenter support_center = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  string reg_dsn = 3;
  string amqp_dsn = 4;
  string jwt_secret = 5;
  // Deprecated: 仅用于解密旧 site_configs enc:v1 数据；新配置不要设置。
  string config_encryption_key = 6 [deprecated = true];
  // RSA 私钥 PEM（签发；仅 user/agent 服务配置）
  string jwt_private_key = 7;
  // RSA 公钥 PEM（验证；所有服务配置）
  string jwt_public_key = 8;
}

// 客户中心（工单系统）对接配置
message SupportCenter {
  string base_url = 1;
  string product_id = 2;
  // 客户中心回调验签密钥（callback_secret），HMAC-SHA256
  string sign_key = 3;
  google.protobuf.Duration timeout = 4;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 5;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Agent {
  string model = 1;
  string secret = 2;
  string endpoint = 3;
}

message SMTP {
  string host = 1;
  int32 port = 2;
  string username = 3;
  string password = 4;
  string from = 5;
}

// 题库 AI 打标专用配置（与 agent 聊天隔离，OpenAI 兼容接口）
message AiAnalyze {
  string endpoint = 1;
  string model = 2;
  string secret = 3;
}
