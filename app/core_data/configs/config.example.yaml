server:
  http:
    addr: 0.0.0.0:8001
    # 题库补全/重试等管理操作可能较久；过短会 500
    timeout: 120s
  grpc:
    addr: 0.0.0.0:9001
    timeout: 120s
  reg_dsn: 192.168.1.7:8500
  amqp_dsn: amqp://cwxu-algo:cwxu-algo@192.168.1.7:5672/algo
  jwt_secret: ""
  # RSA 公钥 PEM（验证；所有服务配置），生成方式见 user config.example.yaml；环境变量 CWXU_JWT_PUBLIC_KEY 可覆盖
  jwt_public_key: |
    -----BEGIN PUBLIC KEY-----
    <RSA 公钥 PEM>
    -----END PUBLIC KEY-----
  config_encryption_key: ""
data:
  database:
    driver: postgres
    source: host=192.168.1.7 user=cwxu password=cwxu dbname=algo_core_data port=5432 sslmode=disable TimeZone=Asia/Shanghai
  redis:
    addr: 192.168.1.7:6379
    password: cwxu
    # 过短会导致 sitesettings.Load 偶发超时，SMTP 读不到、日历确认信静默跳过
    read_timeout: 2s
    write_timeout: 2s

# 业务配置请在站点设置 /admin/site 配置；以下仅作兜底（Redis 无数据时）
ai_analyze:
  endpoint: http://103.24.219.60:8001/api
  model: glm-5-2-260617
  secret: xxx
