server:
  http:
    addr: 0.0.0.0:8002
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9002
    timeout: 1s
  reg_dsn: 192.168.31.251:8500
  amqp_dsn: amqp://cwxu-algo:cwxu-algo@127.0.0.1:5672/algo
  jwt_secret: ""
  # RSA 私钥 PEM（签发 agent 内部服务端身份 token；仅 user/agent 配置），生成方式见 user config.example.yaml
  jwt_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    <RSA 私钥 PEM>
    -----END RSA PRIVATE KEY-----
  # RSA 公钥 PEM（验证；所有服务配置），环境变量 CWXU_JWT_PUBLIC_KEY 可覆盖
  jwt_public_key: |
    -----BEGIN PUBLIC KEY-----
    <RSA 公钥 PEM>
    -----END PUBLIC KEY-----
  config_encryption_key: ""
data:
  database:
    driver: postgres
    source: host=127.0.0.1 user=cwxu password=cwxu dbname=algo_user port=35432 sslmode=disable TimeZone=Asia/Shanghai
  redis:
    addr: 127.0.0.1:6379
    password: cwxu
    read_timeout: 0.2s
    write_timeout: 0.2s

# 业务配置请在站点设置 /admin/site 配置；以下仅作兜底（Redis 无数据时）
# Agent（日报/周报 OpenAI 兼容）配置只认站点设置，不在此兜底。

smtp:
  host: smtp.163.com
  port: 465
  username: xxx@163.com
  password: xxx
  from: xxx@163.com
