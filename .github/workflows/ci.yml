name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            app/gateway/go.sum
      - name: Build backend services
        run: |
          go build ./app/user/cmd/user
          go build ./app/core_data/cmd/core_data
          go build ./app/agent/cmd/agent
          (cd app/gateway && go build ./cmd/gateway)
      - name: Validate Compose
        env:
          FRONTEND_IMAGE: registry.cn-hangzhou.aliyuncs.com/sanenchen/goalgo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GATEWAY_IMAGE: registry.cn-hangzhou.aliyuncs.com/sanenchen/goalgo@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          USER_IMAGE: registry.cn-hangzhou.aliyuncs.com/sanenchen/goalgo@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          CORE_DATA_IMAGE: registry.cn-hangzhou.aliyuncs.com/sanenchen/goalgo@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          AGENT_IMAGE: registry.cn-hangzhou.aliyuncs.com/sanenchen/goalgo@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build backend images without pushing
        run: |
          for target in gateway user core-data agent; do
            docker build --target "$target" -f deploy/docker/backend.Dockerfile -t "goalgo-$target:ci" .
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WXUProjects/AlgoAnalysisFront-new
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: WXUProjects/AlgoAnalysisFront-new
          path: frontend
      - name: Build frontend image without pushing
        run: |
          docker build \
            --build-context frontend-source=./frontend \
            --build-context shared-source=./frontend/shared \
            -f backend/deploy/docker/frontend.Dockerfile \
            -t goalgo-frontend:ci backend
