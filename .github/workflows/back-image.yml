name: back-image

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: back-image-main
  cancel-in-progress: false

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/sanenchen/goalgo

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, user, core-data, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ACR_IMAGE }}:${{ matrix.target }}-sha-${{ github.sha }}

  promote-latest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Promote backend latest tags
        run: |
          for target in gateway user core-data agent; do
            docker buildx imagetools create \
              --tag "$ACR_IMAGE:${target}-latest" \
              "$ACR_IMAGE:${target}-sha-$GITHUB_SHA"
          done