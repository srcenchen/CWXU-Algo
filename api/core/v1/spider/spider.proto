syntax = "proto3";

package api.core.v1.spider;

import "google/api/annotations.proto";
option go_package = "cwxu-algo/api/core/v1/spider;spider";
option java_multiple_files = true;
option java_package = "api.core.v1.spider";

service Spider {
  rpc SetSpider (SetSpiderReq) returns (SetSpiderRep) {
    option (google.api.http) = {
      post: "/v1/core/spider/set",
      body: "*"
    };
  }
  rpc GetSpider (GetSpiderReq) returns (GetSpiderRep) {}
  rpc Update (UpdateReq) returns (UpdateRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/update",
      body: "*"
    };
  }
  // 管理员一键全量更新所有已绑定 OJ 的用户
  rpc UpdateAll (UpdateAllReq) returns (UpdateAllRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/update-all",
      body: "*"
    };
  }
  // 删除用户时清空该用户在 core 的全部数据（OJ 绑定 / 提交 / 比赛记录）
  rpc PurgeUserData (PurgeUserDataReq) returns (PurgeUserDataRes) {}
  // 运维：提交库存（明细 / 账本真实行数，仅站管）
  rpc SubmitInventory (SubmitInventoryReq) returns (SubmitInventoryRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/submit-inventory"
    };
  }
  // 运维：清空全部提交相关数据并全量重爬（仅站管；confirm=PURGE_SUBMITS）
  rpc PurgeSubmitsAndRecrawl (PurgeSubmitsAndRecrawlReq) returns (PurgeSubmitsAndRecrawlRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/purge-submits-and-recrawl",
      body: "*"
    };
  }
  // 内部：休眠唤醒 / 服务间入队爬虫（无 HTTP）
  rpc EnqueueUserSpider (EnqueueUserSpiderReq) returns (EnqueueUserSpiderRes) {}
  // 运维：各 OJ 爬虫模块监控（仅站管）
  rpc GetSpiderMonitor (SpiderMonitorReq) returns (SpiderMonitorRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/monitor"
    };
  }
}

message SetSpiderReq {
  int64 userId = 1;
  string platform = 2;
  string username = 3;
}

message SetSpiderRep {
  int32 code = 1;
  string message = 2;
}

message GetSpiderReq {
  int64 userId = 1;
}

message GetSpiderRep {
  message Data {
    string platform = 1;
    string username = 2;
    // 平台当前 rating（整数）；hasRating=false 时忽略
    int32 rating = 3;
    // 是否已抓到有效 rating
    bool hasRating = 4;
    // 该平台最近一次爬虫成功时间（unix 秒；0=尚无成功记录）
    int64 lastSyncAt = 5;
    // 该平台最近一次爬虫失败时间（unix 秒；0=无失败记录或已被成功覆盖）
    int64 lastFailAt = 6;
    // 最近一次失败的短错误文案（成功后清空）
    string lastError = 7;
  }
  repeated Data data = 1;
  // 最近一次爬虫成功时间（unix 秒；0=尚无成功同步记录；任意平台成功都会刷新）
  int64 lastSyncAt = 2;
}

message UpdateReq {
  int64 user_id = 1;
}

message UpdateRes {
  int64 code = 1;
  string message = 2;
}

message UpdateAllReq {}

message UpdateAllRes {
  int64 code = 1;
  string message = 2;
  int64 count = 3; // 触发更新的用户数
}

message PurgeUserDataReq {
  int64 userId = 1;
}

message PurgeUserDataRes {
  int64 code = 1;
  string message = 2;
}

message SubmitInventoryReq {}

message SubmitInventoryRes {
  int64 code = 1;
  string message = 2;
  // submit_logs 总行数（含力扣合成）
  int64 submitLogsTotal = 3;
  // 计入提交统计的行（排除 lc-ac / lc-prob）
  int64 submitLogsRealTotal = 4;
  // 已废弃（账本表已删，固定 0，保留字段号兼容）
  int64 countedSubmitIdsTotal = 5;
  // 明细时间范围（unix 秒；无数据为 0）
  int64 oldestTime = 6;
  int64 newestTime = 7;
}

message PurgeSubmitsAndRecrawlReq {
  // 必须为 PURGE_SUBMITS
  string confirm = 1;
}

message PurgeSubmitsAndRecrawlRes {
  int64 code = 1;
  string message = 2;
  int64 deletedSubmitLogs = 3;
  // 已废弃（账本表已删，固定 0，保留字段号兼容）
  int64 deletedLedger = 4;
  int64 deletedDaily = 5;
  int64 deletedAc = 6;
  int64 enqueuedUsers = 7;
}

message EnqueueUserSpiderReq {
  int64 userId = 1;
  // true=全量（休眠唤醒）
  bool needAll = 2;
}

message EnqueueUserSpiderRes {
  int64 code = 1;
  string message = 2;
  int64 published = 3;
}

message SpiderMonitorReq {}

message SpiderMonitorRes {
  int64 code = 1;
  string message = 2;
  repeated SpiderPlatformStat platforms = 3;
  // 采集时间（unix 秒）
  int64 collectedAt = 4;
}

// 单个 OJ 的爬虫各模块监控
message SpiderPlatformStat {
  string platform = 1;
  // 绑定该 OJ 的用户数
  int64 boundUsers = 2;
  // 该 OJ 已入库提交记录数
  int64 submitCount = 3;
  // 今日入队任务数
  int64 todayEnqueued = 4;
  // 今日成功任务数
  int64 todayOk = 5;
  // 今日失败任务数
  int64 todayFail = 6;
  // 最近一次成功同步（unix 秒；0=无）
  int64 lastOkAt = 7;
  // 最近一次同步失败（unix 秒；0=无）
  int64 lastFailAt = 8;
  // 最近一次失败短文案
  string lastError = 9;
  // 题库模块：已入库题目数
  int64 problemCount = 10;
  // 比赛模块：日历已入库场次数
  int64 contestCount = 11;
  // 是否有提交爬虫能力
  bool hasSubmitFetcher = 12;
  // 是否有题库爬虫能力
  bool hasProblemFetch = 13;
  // 是否有比赛日历能力
  bool hasContestCalendar = 14;
  // 是否有全局账号（洛谷/QOJ）
  bool hasAccount = 15;
  // 账号状态（ok/fail/unchecked；无全局账号时忽略）
  string accountStatus = 16;
  // 账号最近状态时间（unix 秒）
  int64 accountAt = 17;
  // 账号失败原因
  string accountErr = 18;
}

