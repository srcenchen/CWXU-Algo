syntax = "proto3";

package api.core.v1.spider;

import "google/api/annotations.proto";
option go_package = "cwxu-algo/api/core/v1/spider;spider";
option java_multiple_files = true;
option java_package = "api.core.v1.spider";

service Spider {
  rpc SetSpider (SetSpiderReq) returns (SetSpiderRep) {
    option (google.api.http) = {
      post: "/v1/core/spider/set",
      body: "*"
    };
  }
  rpc GetSpider (GetSpiderReq) returns (GetSpiderRep) {}
  rpc Update (UpdateReq) returns (UpdateRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/update",
      body: "*"
    };
  }
  // 管理员一键全量更新所有已绑定 OJ 的用户
  rpc UpdateAll (UpdateAllReq) returns (UpdateAllRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/update-all",
      body: "*"
    };
  }
  // 删除用户时清空该用户在 core 的全部数据（OJ 绑定 / 提交 / 比赛记录）
  rpc PurgeUserData (PurgeUserDataReq) returns (PurgeUserDataRes) {}
  // 运维：提交库存（明细 / 账本真实行数，仅站管）
  rpc SubmitInventory (SubmitInventoryReq) returns (SubmitInventoryRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/submit-inventory"
    };
  }
  // 运维：清空全部提交相关数据并全量重爬（仅站管；confirm=PURGE_SUBMITS）
  rpc PurgeSubmitsAndRecrawl (PurgeSubmitsAndRecrawlReq) returns (PurgeSubmitsAndRecrawlRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/purge-submits-and-recrawl",
      body: "*"
    };
  }
  // 内部：休眠唤醒 / 服务间入队爬虫（无 HTTP）
  rpc EnqueueUserSpider (EnqueueUserSpiderReq) returns (EnqueueUserSpiderRes) {}
  // 运维：各 OJ 爬虫模块监控（仅站管）
  rpc GetSpiderMonitor (SpiderMonitorReq) returns (SpiderMonitorRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/monitor"
    };
  }
  // 站管：暂停 / 恢复某 OJ 的爬虫同步（body: { platform, enabled }）
  rpc TogglePlatform (TogglePlatformReq) returns (TogglePlatformRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/toggle-platform"
      body: "*"
    };
  }
  // 站管：按平台全量回填（body: { platform }；如力扣比赛记录）。
  // 仅入队该平台已绑定用户的 needAll 任务，并强制清去重。
  rpc UpdatePlatform (UpdatePlatformReq) returns (UpdatePlatformRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/update-platform"
      body: "*"
    };
  }
  // 站管：幂等修复 AtCoder 赛时提交明细相关脏数据（external_id / 赛后练习格 / relative_sec）
  rpc RepairContestCells (RepairContestCellsReq) returns (RepairContestCellsRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/repair-contest-cells"
      body: "*"
    };
  }
  // 站管：某 OJ 的绑定用户列表（仅站管）
  rpc GetPlatformUsers (GetPlatformUsersReq) returns (GetPlatformUsersRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/platform-users"
    };
  }
  // 用户：手动增量刷新自己的 OJ 做题记录（每日限 2 次；返回剩余次数）
  rpc RefreshSpider (RefreshSpiderReq) returns (RefreshSpiderRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/refresh"
      body: "*"
    };
  }
  // 查询今日手动刷新做题记录状态（配额 / 剩余 / 冷却 / 生效间隔；只读）。
  // userId=0 查询自己；站点管理员可传 userId 查询任意用户。
  rpc RefreshSpiderStatus (RefreshSpiderStatusReq) returns (RefreshSpiderStatusRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/refresh-status"
    };
  }
  // Browser-local Luogu sync: requires X-GoAlgo-Plugin-Token at the service.
  rpc StartLuoguSync (StartLuoguSyncReq) returns (StartLuoguSyncRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/luogu-sync/start"
      body: "*"
    };
  }
  // Restore an active session using X-GoAlgo-Sync-Session.
  rpc LuoguSyncStatus (LuoguSyncStatusReq) returns (LuoguSyncStatusRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/luogu-sync/status"
    };
  }
  // Upload one normalized Luogu record page using X-GoAlgo-Sync-Session.
  rpc UploadLuoguSyncPage (UploadLuoguSyncPageReq) returns (UploadLuoguSyncPageRes) {
    option (google.api.http) = {
      post: "/v1/core/spider/luogu-sync/page"
      body: "*"
    };
  }
  // Requires site.user.sync. This route uses the normal user JWT.
  rpc AdminListClientSyncAudits (AdminListClientSyncAuditsReq) returns (AdminListClientSyncAuditsRes) {
    option (google.api.http) = {
      get: "/v1/core/admin/plugins/sync-audits"
    };
  }
  // 公开只读：将洛谷 UID 或用户名规范化为成对身份。
  rpc ResolveLuoguUser (ResolveLuoguUserReq) returns (ResolveLuoguUserRes) {
    option (google.api.http) = {
      get: "/v1/core/spider/luogu/resolve-user"
    };
  }
}

message SetSpiderReq {
  int64 userId = 1;
  string platform = 2;
  string username = 3;
}

message SetSpiderRep {
  int32 code = 1;
  string message = 2;
}

message GetSpiderReq {
  int64 userId = 1;
}

message GetSpiderRep {
  message Data {
    string platform = 1;
    string username = 2;
    // 平台当前 rating（整数）；hasRating=false 时忽略
    int32 rating = 3;
    // 是否已抓到有效 rating
    bool hasRating = 4;
    // 该平台最近一次爬虫成功时间（unix 秒；0=尚无成功记录）
    int64 lastSyncAt = 5;
    // 该平台最近一次爬虫失败时间（unix 秒；0=无失败记录或已被成功覆盖）
    int64 lastFailAt = 6;
    // 最近一次失败的短错误文案（成功后清空）
    string lastError = 7;
  }
  repeated Data data = 1;
  // 最近一次爬虫成功时间（unix 秒；0=尚无成功同步记录；任意平台成功都会刷新）
  int64 lastSyncAt = 2;
}

message UpdateReq {
  int64 user_id = 1;
}

message UpdateRes {
  int64 code = 1;
  string message = 2;
}

message UpdateAllReq {}

message UpdateAllRes {
  int64 code = 1;
  string message = 2;
  int64 count = 3; // 触发更新的用户数
}

message PurgeUserDataReq {
  int64 userId = 1;
}

message PurgeUserDataRes {
  int64 code = 1;
  string message = 2;
}

message SubmitInventoryReq {}

message SubmitInventoryRes {
  int64 code = 1;
  string message = 2;
  // submit_logs 总行数（含力扣合成）
  int64 submitLogsTotal = 3;
  // 计入提交统计的行（排除 lc-ac / lc-prob）
  int64 submitLogsRealTotal = 4;
  // 已废弃（账本表已删，固定 0，保留字段号兼容）
  int64 countedSubmitIdsTotal = 5;
  // 明细时间范围（unix 秒；无数据为 0）
  int64 oldestTime = 6;
  int64 newestTime = 7;
}

message PurgeSubmitsAndRecrawlReq {
  // 必须为 PURGE_SUBMITS
  string confirm = 1;
}

message PurgeSubmitsAndRecrawlRes {
  int64 code = 1;
  string message = 2;
  int64 deletedSubmitLogs = 3;
  // 已废弃（账本表已删，固定 0，保留字段号兼容）
  int64 deletedLedger = 4;
  int64 deletedDaily = 5;
  int64 deletedAc = 6;
  int64 enqueuedUsers = 7;
}

message EnqueueUserSpiderReq {
  int64 userId = 1;
  // true=全量（休眠唤醒）
  bool needAll = 2;
}

message EnqueueUserSpiderRes {
  int64 code = 1;
  string message = 2;
  int64 published = 3;
}

message SpiderMonitorReq {}

message SpiderMonitorRes {
  int64 code = 1;
  string message = 2;
  repeated SpiderPlatformStat platforms = 3;
  // 采集时间（unix 秒）
  int64 collectedAt = 4;
}

// 单个 OJ 的爬虫各模块监控
message SpiderPlatformStat {
  string platform = 1;
  // 绑定该 OJ 的用户数
  int64 boundUsers = 2;
  // 该 OJ 已入库提交记录数
  int64 submitCount = 3;
  // 今日入队任务数
  int64 todayEnqueued = 4;
  // 今日成功任务数
  int64 todayOk = 5;
  // 今日失败任务数
  int64 todayFail = 6;
  // 最近一次成功同步（unix 秒；0=无）
  int64 lastOkAt = 7;
  // 最近一次同步失败（unix 秒；0=无）
  int64 lastFailAt = 8;
  // 最近一次失败短文案
  string lastError = 9;
  // 题库模块：已入库题目数
  int64 problemCount = 10;
  // 比赛模块：日历已入库场次数
  int64 contestCount = 11;
  // 是否有提交爬虫能力
  bool hasSubmitFetcher = 12;
  // 是否有题库爬虫能力
  bool hasProblemFetch = 13;
  // 是否有比赛日历能力
  bool hasContestCalendar = 14;
  // 是否有全局账号（洛谷/QOJ）
  bool hasAccount = 15;
  // 账号状态（ok/fail/unchecked；无全局账号时忽略）
  string accountStatus = 16;
  // 账号最近状态时间（unix 秒）
  int64 accountAt = 17;
  // 账号失败原因
  string accountErr = 18;
  // 站管是否已暂停该 OJ 的爬虫同步（true=暂停；绑定用户仍在，只是不再同步）
  bool paused = 19;
  // 今日新入库（写入数据库）提交记录条数
  int64 todayRows = 20;
  // 提交同步是否暂停
  bool submitPaused = 21;
  // 题面抓取是否暂停
  bool problemPaused = 22;
}

message TogglePlatformReq {
  string platform = 1;
  // true=启用（恢复同步）；false=关闭（暂停同步）
  bool enabled = 2;
  // submit/problem；空值兼容 submit
  string module = 3;
}

message TogglePlatformRes {
  int64 code = 1;
  string message = 2;
}

message UpdatePlatformReq {
  // 平台名（支持别名：力扣/洛谷/cf 等，服务端规范化）
  string platform = 1;
}

message UpdatePlatformRes {
  // 0=成功；1=业务失败（未授权 / 限流 / 参数错误）
  int32 code = 1;
  string message = 2;
  // 入队用户数
  int32 count = 3;
  // 实际 publish 成功数
  int32 published = 4;
  // 规范化后的平台名
  string platform = 5;
}

message RepairContestCellsReq {}

message RepairContestCellsRes {
  bool success = 1;
  string message = 2;
  // 各项修复计数（key: submit_external_id / practice_cells_to_upsolve / relative_sec_updated）
  map<string, int32> data = 3;
}

message GetPlatformUsersReq {
  string platform = 1;
  int64 offset = 2;
  int64 limit = 3;
}

message PlatformUserItem {
  int64 user_id = 1;
  // 站内展示名（无则回退站内用户名）
  string name = 2;
  // 站内用户名
  string username = 3;
  // 绑定的该 OJ 账号
  string oj_username = 4;
  // 平台当前 rating（整数；has_rating=false 时忽略）
  int32 rating = 5;
  bool has_rating = 6;
}

message GetPlatformUsersRes {
  int64 code = 1;
  string message = 2;
  int64 total = 3;
  repeated PlatformUserItem list = 4;
}

message RefreshSpiderReq {}

message RefreshSpiderRes {
  int64 code = 1;
  string message = 2;
  // 今日剩余手动刷新次数（0=已用完）
  int32 remaining = 3;
}

message RefreshSpiderStatusReq {
  // 目标用户 id；0=当前登录用户（站管可传任意 userId 查询他人）
  int64 user_id = 1;
}

message RefreshSpiderStatusRes {
  int64 code = 1;
  string message = 2;
  // 今日有效总配额（已合并订阅 / 站管覆盖；0=禁止）
  int32 limit = 3;
  // 今日剩余次数（0=已用完）
  int32 remaining = 4;
  // 下次可刷新 unix 秒（0=立即可刷新）
  int64 next_available_at = 5;
  // 当前生效自动同步间隔（分钟；min(站管覆盖, 组织 MIN, 订阅档)；失败回落默认）
  int32 sync_interval_min = 6;
}

message StartLuoguSyncReq {
  string client_kind = 1;
  string client_version = 2;
  // Stable random id persisted by the browser before the first request. The
  // same id always replays the same session issuance without rotating tokens.
  string request_id = 3;
}

message StartLuoguSyncRes {
  string session_id = 1;
  string session_token = 2;
  bool resumed = 3;
  int32 next_page = 4;
  int32 page_delay_ms = 5;
  int64 expires_at = 6;
  int64 next_available_at = 7;
}

message LuoguSyncStatusReq {}

message LuoguSyncStatusRes {
  string session_id = 1;
  int32 next_page = 2;
  int64 inserted = 3;
  int32 processed_pages = 4;
  int32 total_pages = 5;
  int64 expires_at = 6;
  int64 next_available_at = 7;
  bool connected = 8;
  bool done = 9;
  string completion_reason = 10;
}

message LuoguSyncProblem {
  string pid = 1;
  string title = 2;
  int32 difficulty = 3;
}

message LuoguSyncRecord {
  string submit_id = 1;
  int64 submit_time = 2;
  int32 status = 3;
  int32 language = 4;
  LuoguSyncProblem problem = 5;
}

message UploadLuoguSyncPageReq {
  string luogu_uid = 1;
  int32 page = 2;
  int32 remote_count = 3;
  int32 per_page = 4;
  repeated LuoguSyncRecord records = 5;
}

message UploadLuoguSyncPageRes {
  bool connected = 1;
  bool done = 2;
  string completion_reason = 3;
  int32 next_page = 4;
  bool restart = 5;
  int64 page_inserted = 6;
  int64 inserted = 7;
  int32 processed_pages = 8;
  int32 total_pages = 9;
  int64 next_available_at = 10;
}

message AdminListClientSyncAuditsReq {
  int32 page_num = 1;
  int32 page_size = 2;
  string keyword = 3;
  string platform = 4;
  string status = 5;
  // Unix 秒；按 started_at 过滤（包含边界）。
  int64 from = 6;
  // Unix 秒；按 started_at 过滤（包含边界）。
  int64 to = 7;
}

message ClientSyncAuditInfo {
  string session_id = 1;
  uint64 authorization_id = 2;
  int64 user_id = 3;
  string platform = 4;
  string oj_uid = 5;
  string client_kind = 6;
  string client_version = 7;
  string status = 8;
  string completion_reason = 9;
  int64 started_at = 10;
  int64 updated_at = 11;
  int64 terminal_at = 12;
  int32 processed_pages = 13;
  int32 remote_count = 14;
  int64 inserted = 15;
  int32 restart_count = 16;
  string error_code = 17;
  string error_message = 18;
  string username = 19;
}

message AdminListClientSyncAuditsRes {
  repeated ClientSyncAuditInfo list = 1;
  int64 total = 2;
  int32 page_num = 3;
  int32 page_size = 4;
}

message ResolveLuoguUserReq {
  string query = 1;
}

message ResolveLuoguUserRes {
  string uid = 1;
  string username = 2;
}
