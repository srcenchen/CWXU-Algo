tags:
    - name: Auth
      description: Auth 认证服务
    - name: Backup
    - name: Blog
      description: |-
        个人博客服务（文章/评论/点赞/分类/标签/主题/页面/协议开通/插件版本/图片上传/站管管理/举报）
         实现位于 user/internal/service/blog*.go（由手写 HTTP 路由迁移而来）。
         路径前缀：/v1/user/blog/*
    - name: Bulletin
      description: 公告：scope=site 全站（仅站点管理员）/ scope=org 组织公告（组织教练及以上）
    - name: Community
      description: |-
        社区服务（题目评论 / 用户题解 / 点赞举报 / 发现动态 / 资料近期）
         实现位于 core_data/internal/service/community.go（原手写 HTTP 路由迁移）。
         路径前缀：/v1/core/problem/comment/* /v1/core/problem/solution/* /v1/core/problem/{like,report}*
                   /v1/core/activity/feed /v1/core/user/recent-*

         响应统一 {success, message, data|list...}，业务错误也返回 HTTP 200 + success=false。
         int64 字段在 JSON 中输出为字符串（protojson），前端 request()/num() 已兼容。
    - name: Contest
      description: 竞赛服务
    - name: ContestCalendar
      description: 比赛日历：公开赛程聚合 + 邮件订阅
    - name: Emergency
      description: 紧急通知：全站强制弹窗，仅站点管理员可管理
    - name: Group
    - name: Health
      description: 站点健康与容量监控（站点管理员）
    - name: LuoguPlugin
      description: LuoguPlugin manages browser-local Luogu sync device authorization.
    - name: Notification
      description: |-
        站内信服务（迁移自手写 RegisterNotificationRoutes）
         路径前缀：/v1/user/notification/*
    - name: Org
      description: |-
        Org 组织 / 分队 / 管理范围服务
         实现位于 app/user/internal/service/org.go + squad.go（迁移自手写 HTTP 路由）。
         路径前缀：/v1/user/org/*（set-site-admin 例外，位于 /v1/user/platform/set-site-admin）。
         响应统一 { code: 0|1, message, ... }：code=0 成功，code=1 业务错误（HTTP 200）。
    - name: Paste
      description: |-
        Paste 文本/代码粘贴板
         实现位于 user/internal/service/paste.go（由手写 HTTP 路由迁移而来）。
         路径前缀：/v1/user/paste/*
    - name: Problem
    - name: Problemset
      description: |-
        题单服务（收藏 / 待做 / 自定义 + 广场）
         实现位于 core_data/internal/service/problemset.go（与 community 相同，手写 HTTP 路由）。
         路径前缀：/v1/core/problemset/*

         系统题单 kind=favorites|todo；自定义 kind=custom。
         可见性 visibility=private|password|public（仅 public 进广场 / 题目页挂出）。
    - name: Profile
    - name: Rbac
      description: |-
        细粒度 RBAC 服务（权限点目录 / 自定义角色 / 成员指派）。
         实现位于 user/internal/service/rbac.go。
         路径前缀：/v1/user/rbac/*

         内置角色权限集代码锁定；本服务只管理自定义角色与其成员指派。
         内置角色的任命仍走既有入口（org members/set-role、platform/set-*），并双写 user_roles 镜像。
    - name: Role
      description: 角色服务：查看角色列表、设置用户角色
    - name: Site
    - name: Social
      description: |-
        Social 社交与隐私服务（关注 / 粉丝 / 搜索 / 隐私设置）
         实现位于 user/internal/service/social.go。
         路径前缀：/v1/user/social/* 与 /v1/user/privacy/*

         公开读（JWT 可选）：following / followers / counts / relation / search / identity / privacy/status
         需登录：follow / unfollow / privacy/get / privacy/update
    - name: Spider
    - name: Statistic
    - name: Submit
    - name: Subscription
      description: |-
        C 端个人订阅（Plus/Pro）：
         - 套餐档位 free|plus|pro，价格与配额存 subscription_plans（站管可改）
         - 开通：支付FM在线支付（create-order → 支付链接跳转 → 回调履约）或站管人工赋予（grant）
         - 资格生效点：每日手动刷新配额、自动同步间隔、题面爬取/AI 分析、AI 日报、badge
    - name: Summary
    - name: TicketService
      description: |-
        TicketService 工单服务（对接外部客户中心；数据不本地缓存，客户中心是唯一事实来源）
         实现位于 user/internal/service/ticket.go。
         路径前缀：/v1/user/tickets/*。全部接口需登录；未配置支持中心时返回
         success:false + message「支持中心未配置，请稍后再试」。
