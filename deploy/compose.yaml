name: ${COMPOSE_PROJECT_NAME:-goalgo}

x-app: &app
  restart: unless-stopped
  env_file:
    - ${GOALGO_ROOT:-/opt/goalgo}/secrets/app.env
  volumes:
    - ${GOALGO_ROOT:-/opt/goalgo}/config:/etc/goalgo/config:ro
  networks: [goalgo]
  security_opt:
    - no-new-privileges:true

services:
  frontend:
    image: ${FRONTEND_IMAGE?set FRONTEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [goalgo]
    security_opt:
      - no-new-privileges:true

  gateway:
    <<: *app
    image: ${GATEWAY_IMAGE?set GATEWAY_IMAGE to an immutable image digest}
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/config:/etc/goalgo/config:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/jwt_public_key.pem:/run/secrets/jwt_public_key.pem:ro
    expose: ["8080"]
    depends_on:
      consul:
        condition: service_healthy
      user:
        condition: service_healthy
      core-data:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  user:
    <<: *app
    image: ${USER_IMAGE?set USER_IMAGE to an immutable image digest}
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/config:/etc/goalgo/config:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/jwt_public_key.pem:/run/secrets/jwt_public_key.pem:ro
    expose: ["8000", "9000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  core-data:
    <<: *app
    image: ${CORE_DATA_IMAGE?set CORE_DATA_IMAGE to an immutable image digest}
    expose: ["8001", "9001"]
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/config:/etc/goalgo/config:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/jwt_public_key.pem:/run/secrets/jwt_public_key.pem:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/backup_encryption_key:/run/secrets/backup_encryption_key:ro
    environment:
      CWXU_BACKUP_WORK_DIR: /var/lib/goalgo/backups
      CWXU_BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  agent:
    <<: *app
    image: ${AGENT_IMAGE?set AGENT_IMAGE to an immutable image digest}
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/config:/etc/goalgo/config:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/jwt_public_key.pem:/run/secrets/jwt_public_key.pem:ro
    expose: ["8002", "9002"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8002/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:0.8.1-pg18-bookworm@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goalgo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/data/postgres:/var/lib/postgresql
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/postgres_password:/run/secrets/postgres_password:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/config/postgres-init.sh:/docker-entrypoint-initdb.d/10-goalgo-databases.sh:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [goalgo]

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/data/redis:/data
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/redis_password:/run/secrets/redis_password:ro
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [goalgo]

  rabbitmq:
    image: rabbitmq:4.2.0-management-alpine@sha256:304c771246b261babf09677f27b82c99b5c05330b0e8c73fcc133498cb021aec
    entrypoint: ["/usr/local/bin/goalgo-rabbitmq-entrypoint.sh"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-goalgo}
      RABBITMQ_DEFAULT_VHOST: goalgo
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/data/rabbitmq:/var/lib/rabbitmq
      - ${GOALGO_ROOT:-/opt/goalgo}/secrets/rabbitmq_password:/run/secrets/rabbitmq_password:ro
      - ${GOALGO_ROOT:-/opt/goalgo}/config/rabbitmq-entrypoint.sh:/usr/local/bin/goalgo-rabbitmq-entrypoint.sh:ro
    expose: ["5672", "15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [goalgo]

  consul:
    image: hashicorp/consul:1.21.5@sha256:6126c30072690cb3173a450ff5bde120c3a01e11c9dccab83b1b2314d4c828bd
    restart: unless-stopped
    command: ["agent", "-server", "-bootstrap-expect=1", "-client=0.0.0.0", "-ui", "-data-dir=/consul/data"]
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/data/consul:/consul/data
    expose: ["8500", "8600/udp"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [goalgo]

  nginx:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
    restart: unless-stopped
    ports:
      - "${GOALGO_HTTP_BIND:-0.0.0.0}:${GOALGO_HTTP_PORT:-8988}:8080"
    volumes:
      - ${GOALGO_ROOT:-/opt/goalgo}/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
      user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [goalgo]
    security_opt:
      - no-new-privileges:true

networks:
  goalgo:
    driver: bridge
