geo $goalgo_trusted_proxy {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map "$goalgo_trusted_proxy:$http_x_forwarded_proto" $goalgo_forwarded_proto {
    default $scheme;
    "~^1:(https?)$" $1;
}

map "$goalgo_trusted_proxy:$http_x_forwarded_host" $goalgo_forwarded_host {
    default $host;
    "~^1:[A-Za-z0-9.-]+(?::[0-9]{1,5})?$" $http_x_forwarded_host;
}

server {
    listen 8080;
    server_name _;
    charset utf-8;
    client_max_body_size 2g;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $goalgo_forwarded_proto;
    proxy_set_header X-Forwarded-Host $goalgo_forwarded_host;
    proxy_connect_timeout 5s;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml application/wasm;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /sitemap.xml {
        proxy_pass http://user:8000/v1/user/seo/sitemap.xml;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=600";
    }

    # Management routes stay in the SPA rather than the public SEO renderer.
    location ~ ^/blog/[^/]+/manage {
        proxy_pass http://frontend:8080;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location ~ ^/problemset/[^/]+/add-problem {
        proxy_pass http://frontend:8080;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    # Regex SEO routes rewrite before proxy_pass because URI suffixes are invalid
    # on proxy_pass directives inside regex locations.
    location ~ ^/(blog/|question-bank/detail/|problemset|profile|p/[A-Za-z0-9]+$) {
        rewrite ^ /v1/user/seo/html break;
        proxy_pass http://user:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goalgo_forwarded_proto;
        proxy_set_header X-Forwarded-Host $goalgo_forwarded_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 30s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /blog-plaza {
        proxy_pass http://user:8000/v1/user/seo/html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goalgo_forwarded_proto;
        proxy_set_header X-Forwarded-Host $goalgo_forwarded_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    }

    location = /tools/paste {
        proxy_pass http://user:8000/v1/user/seo/html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goalgo_forwarded_proto;
        proxy_set_header X-Forwarded-Host $goalgo_forwarded_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    }

    location ^~ /api/ {
        proxy_pass http://gateway:8080/v1/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location ~* \.(js|css|woff2?|ttf|eot|map|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        proxy_pass http://frontend:8080;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location @spa {
        rewrite ^ /index.html break;
        proxy_pass http://frontend:8080;
    }
}
